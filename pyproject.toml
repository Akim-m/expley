[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-exploit"
version = "0.1.0"
description = "Survival-analysis tooling for temporal CVE weaponization prediction"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.3",
  "pyarrow>=17.0.0",
  "numpy>=1.26",
  "scikit-learn>=1.5.2",
  "scikit-survival>=0.23",
  "lifelines>=0.30.0",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8", "pre-commit>=4.0"]
# Heavy, optional deep-survival path (pulls torch); kept out of core/dev/CI.
deep = ["torch>=2.2", "pycox>=0.3", "torchtuples>=0.2"]
# GPU-capable gradient-boosted AFT model; light install, CUDA optional.
xgb = ["xgboost>=2.0"]
# Gradient-boosted competing-risks model (SurvivalBoost, Inria).
boost = ["hazardous>=0.1"]

[project.scripts]
temporal-exploit = "temporal_exploit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# OneDrive checkout: the default system tmp dir and .pytest_cache hit
# PermissionError during collection, so relocate basetemp into the repo and
# disable the cache plugin. Baked in here so plain `pytest` just works.
addopts = "--basetemp=.pytmp -p no:cacheprovider"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes only — catches real defects (unused imports, undefined names) without
# imposing stylistic reformatting on a hand-written, already-consistent codebase.
select = ["F"]
